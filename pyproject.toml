[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-db"
version = "0.2.0"
description = "A small multimodal document store for brains: Polars index, embedded Qdrant vectors, LlamaIndex retrieval, any OpenAI-compatible endpoint for models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Leo Borcherding", email = "borchborchmail@gmail.com"}]
keywords = ["rag", "vector-search", "polars", "qdrant", "llama-index", "documents", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "polars>=1.0",
    "qdrant-client>=1.9",
    "llama-index-core>=0.13,<0.15",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-embeddings-openai-like>=0.3",
    "llama-index-llms-openai-like>=0.4",
    "click>=8.1",
    "httpx>=0.25",
    "pyyaml>=6",
]

[project.optional-dependencies]
local = ["llama-index-embeddings-huggingface>=0.4"]
ollama = ["llama-index-llms-ollama>=0.5", "llama-index-embeddings-ollama>=0.5"]
hybrid = ["fastembed>=0.3"]
pdf = ["pypdf>=4"]
server = ["mcp>=2.0"]
dev = ["pytest>=8"]
all = ["multimodal-db[local,ollama,hybrid,pdf,server,dev]"]

[project.scripts]
mmdb = "multimodal_db.cli:main"

[project.urls]
Homepage = "https://github.com/Multimodal-Agents/multimodal-db"
Repository = "https://github.com/Multimodal-Agents/multimodal-db"
Issues = "https://github.com/Multimodal-Agents/multimodal-db/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
